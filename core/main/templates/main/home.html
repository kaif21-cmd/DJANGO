
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .home-container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 55px 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 20px;
        }

        h1 {
            color: #222;
            font-size: 36px;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #777;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            min-width: 140px;
            padding: 14px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .signup-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .login-btn {
            border: 2px solid #764ba2;
            color: #764ba2;
        }

        .signup-btn:hover,
        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(102, 126, 234, 0.25);
        }

        .login-btn:hover {
            background: #764ba2;
            color: white;
        }

        .footer {
            margin-top: 35px;
            color: #999;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .home-container {
                padding: 40px 22px;
            }

            h1 {
                font-size: 28px;
            }

            .subtitle {
                font-size: 14px;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="home-container">
        <div class="icon">👋</div>

        <h1>Welcome to My Website</h1>

        <p class="subtitle">
            Your journey starts here! Create your account or log in
            to access your personalized dashboard.
        </p>

        <div class="buttons">
            <a href="{% url 'auth_signup' %}" class="btn signup-btn">
                Sign Up
            </a>

            <a href="{% url 'auth_login' %}" class="btn login-btn">
                Login
            </a>
        </div>

        <p class="footer">
            © 2026 My Website. All rights reserved.
        </p>
    </div>

</body>
</html>
