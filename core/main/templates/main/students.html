{% extends "main/base.html" %}

{% block title %}
Students
{% endblock %}

{% block content %}

<style>

    .student-container {
        max-width: 1100px;
        margin: 30px auto;
        padding: 20px;
    }

    .student-container h1 {
        text-align: center;
        margin-bottom: 25px;
    }

    /* Search */

    .search-box {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
    }

    .search-box input {
        flex: 1;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
    }

    button {
        border: none;
        padding: 10px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
    }

    .search-btn {
        background: #2563eb;
        color: white;
    }

    .all-btn {
        background: #64748b;
        color: white;
    }

    /* Form */

    .form-box {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        margin-bottom: 30px;
    }

    .form-box h2 {
        margin-top: 0;
        margin-bottom: 20px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
    }

    .form-grid input {
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
    }

    .add-btn {
        background: #16a34a;
        color: white;
        margin-top: 20px;
    }

    .update-btn {
        background: #f59e0b;
        color: white;
        margin-top: 20px;
    }

    .clear-btn {
        background: #64748b;
        color: white;
        margin-top: 20px;
    }

    /* Students */

    .student-list {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }

    .student-card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        transition: 0.2s;
    }

    .student-card:hover {
        transform: translateY(-3px);
    }

    .student-card h3 {
        margin-top: 0;
        color: #2563eb;
    }

    .student-card p {
        margin: 8px 0;
        color: #444;
    }

    .edit-btn {
        background: #2563eb;
        color: white;
        margin-top: 10px;
    }

    .delete-btn {
        background: #dc2626;
        color: white;
        margin-top: 10px;
    }

    .cancel-btn {
        background: #64748b;
        color: white;
        margin-top: 20px;
    }

    @media(max-width: 800px) {

        .student-list {
            grid-template-columns: 1fr;
        }

        .form-grid {
            grid-template-columns: 1fr;
        }

        .search-box {
            flex-direction: column;
        }

    }

</style>


<div class="student-container">

    <h1>Student Management System</h1>


    <!-- ========================= -->
    <!-- SEARCH -->
    <!-- ========================= -->

    <div class="search-box">

        <input
            type="text"
            id="search"
            placeholder="Search by name, email, course or skill..."
        >

        <button
            class="search-btn"
            onclick="searchStudents()"
        >
            Search
        </button>

        <button
            class="all-btn"
            onclick="loadStudents()"
        >
            Show All
        </button>

    </div>


    <!-- ========================= -->
    <!-- FORM -->
    <!-- ========================= -->

    <div class="form-box">

        <h2 id="formTitle">
            Add Student
        </h2>


        <div class="form-grid">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
            >

            <input
                type="number"
                id="age"
                placeholder="Age"
            >

            <input
                type="text"
                id="course"
                placeholder="Course"
            >

            <input
                type="text"
                id="gender"
                placeholder="Gender"
            >

            <input
                type="text"
                id="skills"
                placeholder="Skills"
            >

            <input
                type="text"
                id="address"
                placeholder="Address"
            >

        </div>


        <button
            id="saveButton"
            class="add-btn"
            onclick="saveStudent()"
        >
            Add Student
        </button>


        <button
            class="clear-btn"
            onclick="clearForm()"
        >
            Clear
        </button>

    </div>


    <!-- ========================= -->
    <!-- STUDENT LIST -->
    <!-- ========================= -->

    <h2>Students</h2>

    <div
        id="students"
        class="student-list"
    >
        Loading...
    </div>

</div>


<script>


// ==========================================
// GLOBAL EDIT ID
// ==========================================

let editingId = null;


// ==========================================
// LOAD STUDENTS
// ==========================================

function loadStudents() {

    fetch("/api/students/")

        .then(response => {

            if (!response.ok) {
                throw new Error("Failed to load students");
            }

            return response.json();

        })

        .then(data => {

            displayStudents(data);

        })

        .catch(error => {

            console.log(error);

            document.getElementById(
                "students"
            ).innerHTML =
                "<h3>Unable to load students.</h3>";

        });

}


// ==========================================
// SEARCH
// ==========================================

function searchStudents() {

    let keyword =
        document.getElementById(
            "search"
        ).value.trim();


    fetch(
        "/api/students/?search="
        + encodeURIComponent(keyword)
    )

        .then(response => response.json())

        .then(data => {

            displayStudents(data);

        })

        .catch(error => {

            console.log(error);

        });

}


// ==========================================
// DISPLAY
// ==========================================

function displayStudents(data) {

    let output = "";


    if (data.length === 0) {

        output =
            "<h3>No students found.</h3>";

    }

    else {

        data.forEach(student => {

            output += `

                <div class="student-card">

                    <h3>
                        ${student.name}
                    </h3>

                    <p>
                        <strong>ID:</strong>
                        ${student.id}
                    </p>

                    <p>
                        <strong>Email:</strong>
                        ${student.email}
                    </p>

                    <p>
                        <strong>Age:</strong>
                        ${student.age}
                    </p>

                    <p>
                        <strong>Course:</strong>
                        ${student.course}
                    </p>

                    <p>
                        <strong>Gender:</strong>
                        ${student.gender}
                    </p>

                    <p>
                        <strong>Skills:</strong>
                        ${student.skills}
                    </p>

                    <p>
                        <strong>Address:</strong>
                        ${student.address}
                    </p>


                    <button
                        class="edit-btn"
                        onclick="editStudent(${student.id})"
                    >
                        Edit
                    </button>


                    <button
                        class="delete-btn"
                        onclick="deleteStudent(${student.id})"
                    >
                        Delete
                    </button>

                </div>

            `;

        });

    }


    document.getElementById(
        "students"
    ).innerHTML = output;

}


// ==========================================
// EDIT
// ==========================================

function editStudent(id) {

    console.log("Editing ID:", id);


    // First get complete student data

    fetch("/api/students/")

        .then(response => response.json())

        .then(data => {

            let student =
                data.find(
                    item => item.id == id
                );


            if (!student) {

                alert(
                    "Student not found"
                );

                return;

            }


            // Save ID

            editingId =
                student.id;


            // Fill form

            document.getElementById(
                "name"
            ).value =
                student.name;


            document.getElementById(
                "email"
            ).value =
                student.email;


            document.getElementById(
                "age"
            ).value =
                student.age;


            document.getElementById(
                "course"
            ).value =
                student.course;


            document.getElementById(
                "gender"
            ).value =
                student.gender;


            document.getElementById(
                "skills"
            ).value =
                student.skills;


            document.getElementById(
                "address"
            ).value =
                student.address;


            // Change heading

            document.getElementById(
                "formTitle"
            ).innerText =
                "Update Student";


            // Change button

            let button =
                document.getElementById(
                    "saveButton"
                );


            button.innerText =
                "Update Student";


            button.className =
                "update-btn";


            // Scroll to form

            document.querySelector(
                ".form-box"
            ).scrollIntoView({
                behavior: "smooth"
            });

        })

        .catch(error => {

            console.log(error);

        });

}


// ==========================================
// ADD / UPDATE
// ==========================================

function saveStudent() {


    let student = {

        name:
            document.getElementById(
                "name"
            ).value.trim(),

        email:
            document.getElementById(
                "email"
            ).value.trim(),

        age:
            document.getElementById(
                "age"
            ).value,

        course:
            document.getElementById(
                "course"
            ).value.trim(),

        gender:
            document.getElementById(
                "gender"
            ).value.trim(),

        skills:
            document.getElementById(
                "skills"
            ).value.trim(),

        address:
            document.getElementById(
                "address"
            ).value.trim()

    };


    // Basic validation

    if (
        !student.name ||
        !student.email ||
        !student.age ||
        !student.course
    ) {

        alert(
            "Please fill Name, Email, Age and Course"
        );

        return;

    }


    // ======================================
    // UPDATE
    // ======================================

    if (editingId !== null) {


        student.id =
            editingId;


        fetch(
            "/api/students/",
            {

                method: "PUT",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify(student)

            }
        )

        .then(response =>
            response.json()
        )

        .then(data => {

            console.log(data);


            if (data.error) {

                alert(data.error);

                return;

            }


            alert(
                "Student updated successfully!"
            );


            clearForm();

            loadStudents();

        })

        .catch(error => {

            console.log(error);

        });


        return;

    }


    // ======================================
    // CREATE
    // ======================================

    fetch(
        "/api/students/",
        {

            method: "POST",

            headers: {

                "Content-Type":
                    "application/json"

            },

            body:
                JSON.stringify(student)

        }
    )

    .then(response =>
        response.json()
    )

    .then(data => {

        console.log(data);


        if (data.error) {

            alert(data.error);

            return;

        }


        alert(
            "Student added successfully!"
        );


        clearForm();

        loadStudents();

    })

    .catch(error => {

        console.log(error);

    });

}


// ==========================================
// DELETE
// ==========================================

function deleteStudent(id) {


    let confirmDelete =
        confirm(
            "Are you sure you want to delete this student?"
        );


    if (!confirmDelete) {

        return;

    }


    fetch(
        "/api/students/",
        {

            method: "DELETE",

            headers: {

                "Content-Type":
                    "application/json"

            },

            body:
                JSON.stringify({
                    id: id
                })

        }
    )

    .then(response =>
        response.json()
    )

    .then(data => {

        console.log(data);


        if (data.error) {

            alert(data.error);

            return;

        }


        alert(
            "Student deleted successfully!"
        );


        loadStudents();

    })

    .catch(error => {

        console.log(error);

    });

}


// ==========================================
// CLEAR
// ==========================================

function clearForm() {


    editingId = null;


    document.getElementById(
        "name"
    ).value = "";


    document.getElementById(
        "email"
    ).value = "";


    document.getElementById(
        "age"
    ).value = "";


    document.getElementById(
        "course"
    ).value = "";


    document.getElementById(
        "gender"
    ).value = "";


    document.getElementById(
        "skills"
    ).value = "";


    document.getElementById(
        "address"
    ).value = "";


    document.getElementById(
        "formTitle"
    ).innerText =
        "Add Student";


    let button =
        document.getElementById(
            "saveButton"
        );


    button.innerText =
        "Add Student";


    button.className =
        "add-btn";

}


// ==========================================
// INITIAL LOAD
// ==========================================

loadStudents();

</script>


{% endblock %}
